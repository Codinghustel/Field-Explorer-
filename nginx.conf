server {
    listen 80;
  

    root /usr/share/nginx/html;
    index index.html;

    # 2. Include MIME types so the browser knows .js is code
    include /etc/nginx/mime.types;

    # --------------------------------------------------------
    # 3. FIX: Handle static files (JS, CSS, Images) explicitly
    # --------------------------------------------------------
    # This prevents the "index.html served as JS" bug
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        try_files $uri =404;
        access_log off;
    }

    # --------------------------------------------------------
    # 4. MAIN SPA ROUTING
    # --------------------------------------------------------
    location / {
        # Serve the file if it exists, otherwise fallback to index.html
        try_files $uri $uri/ /index.html;

        # Keep your 405 workaround for API posts
        error_page 405 =200 $uri;
    }

    error_page 500 502 503 504 /50x.html;
}