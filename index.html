<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Deal Field Explorer</title>
  <script src="https://api.bitrix24.com/api/v1/"></script>
</head>
<body>
  <p>Loading fields...</p>
  <script>
    BX24.init(function () {

      // One-time self-registration: bind this app as a CRM Deal detail tab.
      // Safe to run every time — Bitrix24 just updates the existing binding.
      BX24.callMethod('placement.bind', {
        PLACEMENT: 'CRM_DEAL_DETAIL_TAB',
        HANDLER: 'https://REPLACE-WITH-YOUR-NEW-FIELD-EXPLORER-DOMAIN/index.html', // TODO: set this to the new Dokploy domain once deployed
        TITLE: 'Field Explorer'
      }, function (bindResult) {
        if (bindResult.error()) {
          console.error('placement.bind error:', bindResult.error());
        } else {
          console.log('Placement bound successfully:', bindResult.data());
        }
      });

      var placementInfo = BX24.placement.info();
      var dealId = (placementInfo.options && placementInfo.options.ID)
                   || getUrlParam('deal_id')
                   || getUrlParam('ID');

      if (!dealId) {
        console.error('No deal ID found. Open this inside a Deal, or add ?deal_id=123 to the URL.');
        document.body.innerHTML = '<p>No deal ID found. Open this inside a real Deal tab (or click OPEN APPLICATION once to register the tab, then go check a Deal).</p>';
        return;
      }

      console.log('Fetching deal #' + dealId + ' ...');

      BX24.callMethod('crm.deal.fields', {}, function (fieldsResult) {
        if (fieldsResult.error()) {
          console.error('crm.deal.fields error:', fieldsResult.error());
          return;
        }
        var fieldMeta = fieldsResult.data();

        BX24.callMethod('crm.deal.get', { id: dealId }, function (dealResult) {
          if (dealResult.error()) {
            console.error('crm.deal.get error:', dealResult.error());
            return;
          }
          var deal = dealResult.data();

          var rows = [];
          Object.keys(deal).forEach(function (code) {
            var meta = fieldMeta[code] || {};
            rows.push({
              code: code,
              label: meta.title || '(no label / system field)',
              type: meta.type || typeof deal[code],
              value: deal[code]
            });
          });

          rows.sort(function (a, b) {
            var aCustom = a.code.indexOf('UF_CRM_') === 0 ? 0 : 1;
            var bCustom = b.code.indexOf('UF_CRM_') === 0 ? 0 : 1;
            if (aCustom !== bCustom) return aCustom - bCustom;
            return a.code.localeCompare(b.code);
          });

          console.log('=== All fields for Deal #' + dealId + ' ===');
          console.table(rows);

          var customOnly = rows.filter(function (r) {
            return r.code.indexOf('UF_CRM_') === 0;
          });
          console.log('=== Custom fields only (UF_CRM_*) ===');
          console.table(customOnly);
// Show only fields that actually have a value on THIS deal
          var withData = rows.filter(function (r) {
            var v = r.value;
            if (v === null || v === undefined) return false;
            if (typeof v === 'string' && v.trim() === '') return false;
            if (Array.isArray(v) && v.length === 0) return false;
            return true;
          });
          console.log('=== Fields WITH actual data on this deal ===');
          console.table(withData);
          renderOnPage(withData);
          // NEW: also fetch linked contacts and their fields (with labels/types)
          BX24.callMethod('crm.contact.fields', {}, function (contactFieldsResult) {
            if (contactFieldsResult.error()) {
              console.error('crm.contact.fields error:', contactFieldsResult.error());
              return;
            }
            var contactFieldMeta = contactFieldsResult.data();

            BX24.callMethod('crm.deal.contact.items.get', { id: dealId }, function (contactsResult) {
              if (contactsResult.error()) {
                console.error('crm.deal.contact.items.get error:', contactsResult.error());
                return;
              }
              var contactLinks = contactsResult.data();
              console.log('=== Linked contacts on this deal ===');
              console.table(contactLinks);

              contactLinks.forEach(function (link) {
                BX24.callMethod('crm.contact.get', { id: link.CONTACT_ID }, function (contactResult) {
                  if (contactResult.error()) {
                    console.error('crm.contact.get error for ID ' + link.CONTACT_ID + ':', contactResult.error());
                    return;
                  }
                  var contact = contactResult.data();
                  var contactRows = Object.keys(contact).map(function (code) {
                    var meta = contactFieldMeta[code] || {};
                    return {
                      code: code,
                      label: meta.title || '(no label / system field)',
                      type: meta.type || typeof contact[code],
                      value: contact[code]
                    };
                  });
                  var filled = contactRows.filter(function (r) {
                    var v = r.value;
                    if (v === null || v === undefined) return false;
                    if (typeof v === 'string' && v.trim() === '') return false;
                    if (Array.isArray(v) && v.length === 0) return false;
                    return true;
                  });
                  console.log('=== Contact #' + link.CONTACT_ID + ' (' + contact.NAME + ' ' + contact.LAST_NAME + ') — filled fields ===');
                  console.table(filled);
                });
              });
            });
          });
        });
      });
    });

    function getUrlParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function renderOnPage(rows) {
      var html = '<h3>Deal Field Explorer</h3><table border="1" cellpadding="4" style="border-collapse:collapse;width:100%;font-family:monospace;font-size:12px;">';
      html += '<tr><th>Code</th><th>Label</th><th>Type</th><th>Value</th></tr>';
      rows.forEach(function (r) {
        html += '<tr><td>' + r.code + '</td><td>' + r.label + '</td><td>' + r.type + '</td><td>' +
                JSON.stringify(r.value) + '</td></tr>';
      });
      html += '</table>';
      document.body.innerHTML = html;
    }
  </script>
</body>
</html>
